<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Added maximum-scale and viewport-fit for notched phones -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000004">
  <title>Gravity X</title>
  <style>
    :root { --cy: #00ffff; --mg: #ff2a7a; --bg: rgba(0, 20, 40, 0.72); }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      margin: 0; padding: 0; overflow: hidden; height: 100%;
      background-color: #000004; font-family: 'Arial', sans-serif;
      user-select: none; -webkit-user-select: none; color: #fff;
      touch-action: none; overscroll-behavior: none;
    }
    canvas { display: block; touch-action: none; }
    .hidden { display: none !important; }

    /* ---------- HUD ---------- */
    #hud { position: absolute; inset: 0; pointer-events: none; z-index: 5; color: var(--cy); text-shadow: 0 0 10px var(--cy); }
    .stat-label { font-size: 12px; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 4px; opacity: .85; }
    .box { background: var(--bg); border: 1px solid var(--cy); padding: 10px 20px; border-radius: 8px; box-shadow: 0 0 15px rgba(0, 255, 255, 0.3); }

    /* Mobile HUD adjustments */
    #top-hud { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; align-items: stretch; text-align: center; width: 95%; max-width: 600px; justify-content: center; }
    #top-hud .big { font-size: 24px; font-weight: bold; font-family: monospace; line-height: 1.1; }
    #top-hud .sub { font-size: 10px; font-family: monospace; color: #fff; text-shadow: none; margin-top: 4px; white-space: nowrap; }
    #timer-box { border-width: 2px; padding: 10px; flex: 1; }
    #timer-value { font-size: 24px; }

    #leaderboard { position: absolute; top: 10px; left: 10px; min-width: 120px; padding: 8px 10px; font-size: 11px; font-family: monospace; }
    #leaderboard .row { display: flex; gap: 6px; padding: 2px 0; color: #cfe; text-shadow: none; }
    #leaderboard .row.me { color: var(--cy); font-weight: bold; text-shadow: 0 0 8px var(--cy); }
    #leaderboard .dot { width: 6px; height: 6px; border-radius: 50%; margin-top: 4px; flex: none; }

    /* Hide minimap on very small screens to save space */
    #minimap-box { position: absolute; top: 10px; right: 10px; padding: 6px; display: none; }
    @media (min-width: 600px) { #minimap-box { display: block; } }
    #minimap { display: block; width: 120px; height: 120px; }

    #toast { position: absolute; top: 24%; left: 50%; transform: translateX(-50%); font-size: 20px; font-weight: bold; letter-spacing: 2px; text-transform: uppercase; opacity: 0; transition: opacity .25s; text-align: center; white-space: nowrap; }
    #toast.show { opacity: 1; }

    #countdown { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); font-size: 100px; font-weight: bold; color: #ff0055; text-shadow: 0 0 30px #ff0055; z-index: 20; pointer-events: none; text-align: center; white-space: nowrap; }
    #countdown.go { color: #33ff88; text-shadow: 0 0 30px #33ff88; }

    /* Bottom HUD - Moved up to avoid touch controls */
    #bottom-hud { position: absolute; bottom: 190px; left: 10px; right: 10px; display: flex; justify-content: space-between; align-items: flex-end; pointer-events: none; }
    #speed-value { font-size: 30px; font-weight: bold; font-family: monospace; }
    #speed-unit { font-size: 10px; margin-left: 4px; opacity: .8; }

    .bar-container { width: 120px; height: 12px; border: 1px solid var(--cy); background: rgba(0, 0, 0, 0.5); border-radius: 6px; overflow: hidden; margin-top: 2px; }
    #boost-bar { height: 100%; width: 100%; background: linear-gradient(90deg, #0055ff, #00ffff); box-shadow: 0 0 10px #00ffff; }
    #health-bar { height: 100%; width: 100%; background: linear-gradient(90deg, #ff0055, #ffaa00); box-shadow: 0 0 10px #ff0055; }

    /* ---------- TOUCH CONTROLS ---------- */
    #touch-controls { position: absolute; inset: 0; z-index: 50; pointer-events: none; display: block; }

    #touch-steer {
      position: absolute; bottom: 20px; left: 20px;
      width: 140px; height: 140px;
      background: rgba(0, 255, 255, 0.1); border: 2px solid var(--cy); border-radius: 50%;
      pointer-events: auto; touch-action: none;
    }
    #touch-steer-knob {
      position: absolute; top: 50%; left: 50%;
      width: 60px; height: 60px;
      background: var(--cy); border-radius: 50%; transform: translate(-50%, -50%);
      box-shadow: 0 0 15px var(--cy); pointer-events: none;
    }

    #touch-buttons {
      position: absolute; bottom: 20px; right: 20px;
      display: grid; grid-template-columns: 80px 80px; gap: 10px; pointer-events: auto;
    }
    .t-btn {
      width: 80px; height: 60px; border-radius: 10px; border: 2px solid var(--cy);
      background: rgba(0, 20, 40, 0.7); color: var(--cy); font-weight: bold; font-size: 14px;
      display: flex; align-items: center; justify-content: center; touch-action: none;
    }
    .t-btn:active, .t-btn.active { background: var(--cy); color: #000; box-shadow: 0 0 15px var(--cy); }
    .t-btn.boost { border-color: var(--mg); color: var(--mg); }
    .t-btn.boost:active, .t-btn.boost.active { background: var(--mg); color: #fff; box-shadow: 0 0 15px var(--mg); }
    .t-btn.fire { border-color: #ffaa00; color: #ffaa00; grid-column: 1 / span 2; width: 100%; }
    .t-btn.fire:active, .t-btn.fire.active { background: #ffaa00; color: #fff; box-shadow: 0 0 15px #ffaa00; }

    /* ---------- MENU & SCREENS ---------- */
    .screen { position: absolute; inset: 0; z-index: 10; display: flex; overflow-y: auto; }
    #menu { background: transparent; pointer-events: none; align-items: center; justify-content: center; }

    .panel { width: 100%; max-width: 480px; padding: 20px; background: rgba(3, 3, 12, 0.85); pointer-events: auto; border: 1px solid var(--cy); border-radius: 10px; margin: 20px; }

    .group { margin-bottom: 12px; }
    .group > label { display: block; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--cy); margin-bottom: 4px; }
    .seg { display: flex; gap: 4px; flex-wrap: wrap; }
    button { background: transparent; color: var(--cy); border: 1px solid var(--cy); padding: 8px 12px; font-size: 13px; font-weight: bold; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; border-radius: 4px; }
    button:active { background: var(--cy); color: #000; }
    .seg button { flex: 1; opacity: .6; }
    .seg button.active { opacity: 1; background: rgba(0, 255, 255, 0.2); box-shadow: 0 0 10px var(--cy); }
    button.primary { font-size: 18px; padding: 12px; flex: 1; background: rgba(0, 255, 255, 0.2); border-width: 2px; }

    .center { align-items: center; justify-content: center; background: rgba(5, 5, 16, 0.86); }
    .card { background: rgba(4, 12, 30, 0.95); border: 1px solid var(--cy); border-radius: 10px; padding: 20px; width: 95%; max-width: 500px; }
    .card h2 { margin: 0 0 10px; color: var(--cy); font-size: 24px; text-align: center; }

    #loading { position: absolute; inset: 0; z-index: 30; background: #000004; display: flex; align-items: center; justify-content: center; color: var(--cy); font-size: 20px; }

    /* Fullscreen Button - adjusted for mobile */
    #fullscreen-btn { position: absolute; top: 10px; right: 10px; z-index: 100; padding: 6px 10px; font-size: 10px; pointer-events: auto; background: rgba(0, 20, 40, 0.5); border: 1px solid var(--cy); border-radius: 4px; color: var(--cy); }
  </style>
</head>
<body>
<div id="loading">Loading</div>

<button id="fullscreen-btn">⛶ Fullscreen</button>

<div id="menu" class="screen hidden">
  <div class="panel">
    <h1 style="color:var(--cy); text-align:center; margin-top:0; font-size:28px; letter-spacing:4px;">GRAVITY X</h1>

    <div class="group"><label>Mode</label>
      <div class="seg" data-key="mode">
        <button data-v="quick" class="active">Quick</button>
        <button data-v="champ">Champ</button>
        <button data-v="tt">Time Trial</button>
      </div>
    </div>

    <div class="group" id="g-track"><label>Track</label>
      <div class="seg" data-key="trackId" id="track-seg"></div>
    </div>

    <div class="group"><label>Laps</label>
      <div class="seg" data-key="laps" data-num="1">
        <button data-v="1">1</button><button data-v="3" class="active">3</button><button data-v="5">5</button>
      </div>
    </div>

    <div class="group" id="g-opp"><label>Opponents</label>
      <div class="seg" data-key="opponents" data-num="1">
        <button data-v="3">3</button><button data-v="5" class="active">5</button><button data-v="7">7</button>
      </div>
    </div>

    <div class="group" id="g-diff"><label>Difficulty</label>
      <div class="seg" data-key="difficulty">
        <button data-v="easy">Easy</button><button data-v="normal" class="active">Normal</button><button data-v="hard">Hard</button>
      </div>
    </div>

    <div class="group">
      <label>Vehicle</label>
      <button id="choose-vehicle-btn" style="width: 100%; text-align: left; display: flex; justify-content: space-between; align-items: center;">
        <span id="selected-vehicle-name">Phantom</span>
        <span style="font-size: 10px; opacity: 0.7;">CHANGE &#9654;</span>
      </button>
    </div>

    <div class="row" style="display:flex; gap:10px; margin-top:20px;">
      <button id="start-btn" class="primary">Start Race</button>
      <button id="records-btn">Records</button>
    </div>
  </div>
</div>

<div id="garage-screen" class="screen center hidden">
  <div class="card">
    <h2 id="garage-name">Phantom</h2>
    <div id="garage-lore" style="font-size:12px; color:#9bd; margin-bottom:15px;">Lore goes here.</div>
    <div id="garage-stats"></div>
    <div style="display:flex; gap:10px; margin-top:20px;">
      <button id="garage-prev" style="flex:1;">&#9664;</button>
      <button id="garage-back" style="flex:1; border-color:var(--mg); color:var(--mg);">Back</button>
      <button id="garage-select" style="flex:1; background:rgba(0,255,255,0.2);">Equip</button>
      <button id="garage-next" style="flex:1;">&#9654;</button>
    </div>
  </div>
</div>

<div id="records-screen" class="screen center hidden">
  <div class="card">
    <h2>RECORDS</h2>
    <div class="stat-grid" id="rec-stats" style="display:flex; justify-content:space-around; text-align:center; margin-bottom:15px; font-size:12px; color:#9bd;"></div>
    <div id="rec-laps-table" style="font-size:12px; font-family:monospace;"></div>
    <div style="display:flex; gap:10px; margin-top:20px;">
      <button id="rec-back-btn" style="flex:1;">Back</button>
      <button id="rec-reset-btn" style="border-color:var(--mg); color:var(--mg);">Reset</button>
    </div>
  </div>
</div>

<div id="hud" class="hidden">
  <div id="leaderboard" class="box"></div>
  <div id="top-hud">
    <div class="box" style="padding:5px 10px;"><div class="stat-label">Lap</div><div class="big" id="lap-value">1/3</div></div>
    <div class="box" id="timer-box">
      <div class="stat-label" style="color:#fff">Time</div>
      <div class="big" id="timer-value">00:00.00</div>
      <div class="sub">Last <span id="last-lap">--</span> &nbsp; Best <span id="best-lap">--</span></div>
    </div>
    <div class="box" style="padding:5px 10px;"><div class="stat-label">Pos</div><div class="big" id="pos-value">1/5</div></div>
  </div>
  <div id="minimap-box" class="box"><canvas id="minimap" width="340" height="340"></canvas></div>
  <div id="toast"></div>

  <div id="bottom-hud">
    <div class="box" style="padding:8px;"><div class="stat-label">Speed</div><div><span id="speed-value">0</span><span id="speed-unit">km/h</span></div></div>
    <div style="display:flex; flex-direction:column; gap:5px;">
      <div class="box" style="padding:5px 10px; text-align:right;">
        <div class="stat-label" style="color:var(--mg); font-size:10px;">Hull</div>
        <div class="bar-container" style="width:100px;"><div id="health-bar"></div></div>
      </div>
      <div class="box" style="padding:5px 10px; text-align:right;">
        <div class="stat-label" style="font-size:10px;">Boost</div>
        <div class="bar-container" style="width:100px;"><div id="boost-bar"></div></div>
      </div>
    </div>
  </div>
</div>

<div id="countdown" class="hidden"></div>

<div id="results" class="screen center hidden">
  <div class="card">
    <h2 id="res-title">FINISH</h2>
    <div id="res-sub" style="text-align:center; font-size:12px; color:#9bd; margin-bottom:15px;"></div>
    <div id="res-badges" style="display:flex; gap:5px; justify-content:center; margin-bottom:15px;"></div>
    <div id="res-table" style="font-size:12px; font-family:monospace; overflow-x:auto;"></div>
    <div id="res-buttons" style="display:flex; gap:10px; margin-top:20px;"></div>
  </div>
</div>

<div id="pause" class="screen center hidden">
  <div class="card" style="text-align:center">
    <h2>PAUSED</h2>
    <div style="display:flex; flex-direction:column; gap:10px; margin-top:20px">
      <button id="resume-btn">Resume</button>
      <button id="pause-restart-btn">Restart Race</button>
      <button id="pause-quit-btn" style="border-color:var(--mg); color:var(--mg);">Quit to Menu</button>
    </div>
  </div>
</div>

<!-- TOUCH CONTROLS ALWAYS VISIBLE -->
<div id="touch-controls">
  <div id="touch-steer"><div id="touch-steer-knob"></div></div>
  <div id="touch-buttons">
    <div class="t-btn" id="t-btn-drift">DRIFT</div>
    <div class="t-btn boost" id="t-btn-boost">BOOST</div>
    <div class="t-btn" id="t-btn-brake" style="grid-column: 1 / span 2; width: 100%;">BRAKE</div>
    <div class="t-btn" id="t-btn-gas" style="grid-column: 1 / span 2; width: 100%;">GAS</div>
    <div class="t-btn fire" id="t-btn-fire">FIRE</div>
  </div>
</div>

<script type="module" src="/main.js"></script>
</body>
</html>
